<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VESPER HEAT — an original open-world crime game in Vesper Bay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #15101a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas:not(#minimap) {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
    }
    #minimap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 190px;
      height: 190px;
      border-radius: 12px;
      background: rgba(20, 16, 26, 0.85);
      border: 2px solid rgba(255, 154, 60, 0.3);
      z-index: 20;
      display: block;
    }
    #screens {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <canvas id="minimap" width="190" height="190"></canvas>
  <div id="screens"></div>

  <script src="vendor/three.min.js"></script>
  <script src="src/config.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/city.js"></script>
  <script src="src/scenery.js"></script>
  <script src="src/vehicles.js"></script>
  <script src="src/people.js"></script>
  <script src="src/player.js"></script>
  <script src="src/police.js"></script>
  <script src="src/missions.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/shots.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
